name: Android CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      SMARTFRAME_ANDROID_DEBUG_KEYSTORE_BASE64:
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Baixar a revisão
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK e ferramentas
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar assinatura persistente
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SMARTFRAME_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Configure o segredo SMARTFRAME_ANDROID_DEBUG_KEYSTORE_BASE64.' >&2; exit 1; }
          export ANDROID_USER_HOME="$RUNNER_TEMP/smartframe-android"
          install -d -m 700 "$ANDROID_USER_HOME"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          test -s "$ANDROID_USER_HOME/debug.keystore"
          chmod 600 "$ANDROID_USER_HOME/debug.keystore"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
      - name: Compilar, testar e verificar lint
        run: bash ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug
      - name: Conferir assinatura do APK publicado
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA256: ${{ vars.SMARTFRAME_ANDROID_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256" || { echo 'Configure a variável SMARTFRAME_ANDROID_SIGNER_SHA256.' >&2; exit 1; }
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "${actual,,}" = "${EXPECTED_SHA256,,}" || { echo 'A assinatura do APK não corresponde à esperada.' >&2; exit 1; }
      - name: Disponibilizar APK de debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartframe-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
