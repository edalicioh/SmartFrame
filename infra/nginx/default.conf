limit_req_zone $binary_remote_addr zone=smartframe_login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 16m;

    location = /api/auth/sign-in/email {
        limit_req zone=smartframe_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:3000;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sobrescreve o cabeçalho recebido para não confiar em IPs enviados pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
